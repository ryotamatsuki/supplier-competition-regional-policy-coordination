name: manuscript-ci

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python verification dependencies
        run: pip install sympy numpy matplotlib
      - name: Run Stage 8 proof-critical algebra regression
        run: python verification/stage8_verify.py
      - name: Run Stage 9 independent final referee regression
        run: python verification/stage9_verify.py
      - name: Regenerate regime figure
        run: python verification/make_uniform_regime_figure.py
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Fail on unresolved references or box warnings
        working-directory: paper
        run: |
          ! grep -E 'undefined references|Reference .* undefined|Citation .* undefined|Overfull \\hbox|Underfull \\hbox' main.log
