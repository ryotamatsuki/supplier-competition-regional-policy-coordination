name: manuscript-ci

on:
  push:
  pull_request:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python verification dependencies
        run: pip install sympy numpy matplotlib
      - name: Run Stage 8 proof-critical algebra regression
        run: python verification/stage8_verify.py
      - name: Run Stage 9 independent final referee regression
        run: python verification/stage9_verify.py
      - name: Run Stage 10 submission preflight
        run: python verification/stage10_preflight.py
      - name: Run workflow-v2.1 independent certification regression
        run: python verification/v21_certification.py
      - name: Regenerate regime figure
        run: python verification/make_uniform_regime_figure.py
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended zip
      - name: Compile anonymous manuscript
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
      - name: Fail on unresolved references or box warnings
        working-directory: paper
        run: |
          ! grep -E 'undefined references|Reference .* undefined|Citation .* undefined|Overfull \\hbox|Underfull \\hbox' main.log
      - name: Compile administrative templates
        working-directory: submission
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error title_page.tex
          pdflatex -interaction=nonstopmode -halt-on-error cover_letter.tex
      - name: Build preflight source archive
        run: |
          mkdir -p dist
          zip -r dist/IJIO-anonymous-source.zip paper figures verification \
            -x '*.aux' '*.log' '*.out' 'paper/main.pdf'
          cp paper/main.pdf dist/anonymous-manuscript.pdf
          cp submission/title_page.pdf dist/title-page-TEMPLATE.pdf
          cp submission/cover_letter.pdf dist/cover-letter-TEMPLATE.pdf
          cp submission/title_page.tex dist/title_page.tex
          cp submission/cover_letter.tex dist/cover_letter.tex
          cp submission/COVER_LETTER_IJIO.md dist/COVER_LETTER_IJIO.md
          cp submission/HIGHLIGHTS.txt dist/HIGHLIGHTS.txt
          cp submission/EDITORIAL_MANAGER_METADATA.md dist/EDITORIAL_MANAGER_METADATA.md
          cp submission/SUBMISSION_PACKET.md dist/SUBMISSION_PACKET.md
          cp submission/AUTHOR_METADATA_CHECKLIST.md dist/AUTHOR_METADATA_CHECKLIST.md
      - name: Upload IJIO preflight packet
        uses: actions/upload-artifact@v4
        with:
          name: IJIO-preflight-packet
          path: dist/
          retention-days: 30

  lean-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned formal environment
        run: |
          test "$(cat formal/lean-toolchain)" = "leanprover/lean4:v4.32.1"
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('formal/lake-manifest.json').read_text())
          packages = {p['name']: p for p in manifest['packages']}
          assert packages['mathlib']['rev'] == '520045ab14e26149ee970e2e617ca04b09bde5d6'
          assert packages['mathlib']['inputRev'] == 'v4.32.1'
          assert all(p.get('rev') for p in manifest['packages'])
          print('Pinned Lean/mathlib manifest verified.')
          PY
      - name: Reject proof placeholders and project axioms
        run: |
          if grep -R -n -E '(^|[^A-Za-z])(sorry|admit)([^A-Za-z]|$)' formal --include='*.lean'; then
            echo 'Formal source contains a forbidden proof placeholder.'
            exit 1
          fi
          if grep -R -n -E '^[[:space:]]*axiom[[:space:]]' formal/SupplierCompetitionPolicy formal/SupplierCompetitionPolicy.lean formal/Main.lean --include='*.lean'; then
            echo 'Formal source contains a project-specific axiom declaration.'
            exit 1
          fi
      - name: Install pinned Lean toolchain
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore mathlib cache
        run: |
          cd formal
          lake exe cache get
      - name: Build proof-critical Lean core
        run: |
          cd formal
          lake build SupplierCompetitionPolicy
      - name: Record theorem/axiom report
        shell: bash
        run: |
          set -euo pipefail
          cd formal
          lake env lean Main.lean 2>&1 | tee FORMAL_AXIOM_REPORT.txt
          test -s FORMAL_AXIOM_REPORT.txt
          grep -q 'planner_threshold_falls' FORMAL_AXIOM_REPORT.txt
          grep -q 'boundary_mixedNash_iff' FORMAL_AXIOM_REPORT.txt
          grep -q 'eventual_reversal_exact' FORMAL_AXIOM_REPORT.txt
          if grep -q 'error:' FORMAL_AXIOM_REPORT.txt; then
            echo 'Lean axiom audit emitted an error.'
            exit 1
          fi
          if grep -q 'sorryAx' FORMAL_AXIOM_REPORT.txt; then
            echo 'Axiom audit detected sorryAx.'
            exit 1
          fi
      - name: Record formal verification provenance
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "certified_theory=P2-IO-THEORY-FREEZE-2026-09-15-v1"
            echo "lean=leanprover/lean4:v4.32.1"
            echo "mathlib=520045ab14e26149ee970e2e617ca04b09bde5d6"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
          } | tee formal/FORMAL_VERIFICATION_RUN.txt
      - name: Upload formal verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-evidence
          path: |
            formal/FORMAL_AXIOM_REPORT.txt
            formal/FORMAL_VERIFICATION_RUN.txt
            formal/AXIOM_AUDIT.md
          retention-days: 30
